[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linswap"
version = "0.1.0"
description = "In-place swapping of linear-attention kernels in pretrained hybrid language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yuang Chen" }]
keywords = ["linear attention", "gated deltanet", "kda", "rwkv", "mamba", "flash-linear-attention", "llm"]
dependencies = [
    "torch>=2.7",
    "triton>=3.3",
    "transformers>=5.16",
    # FLA's PyPI artifacts are incomplete (no `fla.ops` / `fla.modules`) and the last release,
    # 0.5.2, predates the kernels used here; 0.6 is the version git main reports.  Install it from
    # the repository *before* this package -- see README "Installation".
    "flash-linear-attention>=0.6,<0.7",
    "einops",
    "safetensors",
    "huggingface_hub",
    "datasets",
    "numpy",
]

[project.optional-dependencies]
eval = ["accelerate", "lm_eval", "tenacity", "nltk", "wonderwords", "scipy", "beautifulsoup4", "html2text", "pandas", "pyyaml", "tqdm"]
# Mamba-1 / Mamba-3 kernels (mamba_ssm needs triton>=3.5, i.e. torch>=2.9).  Install these with
#   pip install --no-deps --no-build-isolation --no-binary causal-conv1d --no-binary mamba-ssm causal-conv1d mamba-ssm
# so that mamba-ssm cannot replace your torch build; see README "Installation".
mamba = ["causal-conv1d>=1.5", "mamba-ssm>=2.3.2"]
# Hopper-class GPUs (compute capability 9.x) with Triton 3.4–3.7: FLA refuses the Triton backward of gated
# chunk kernels (incorrect results, fla-org/flash-linear-attention#640) and uses TileLang instead.
hopper = ["tilelang>=0.1.8"]

[project.scripts]
linswap = "linswap.cli:main"

[project.urls]
Homepage = "https://github.com/yuang-chen/LinearSwap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linswap = ["py.typed"]
