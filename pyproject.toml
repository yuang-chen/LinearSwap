[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linswap"
version = "0.1.0"
description = "Swap the linear-attention kernel of Qwen3.5 in place and distil it back to the teacher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yuang Chen" }]
keywords = ["linear attention", "gated deltanet", "kda", "rwkv", "mamba", "flash-linear-attention", "llm"]
dependencies = [
    "torch>=2.7",
    "triton>=3.3",
    "transformers>=5.17",          # the Qwen3.5 model the swap happens in
    # FLA's PyPI artifacts are incomplete (no `fla.ops` / `fla.modules`) and the last release,
    # 0.5.2, predates the kernels used here; 0.6 is the version git main reports.  Install it from
    # the repository *before* this package -- see README "Install".
    "flash-linear-attention>=0.6,<0.7",
    "einops",
    "safetensors",
    "huggingface_hub",
    "datasets",
    "pillow",
    # torchvision is needed by the upstream image processor.  Install the build that matches your torch
    # without dependency resolution, or it replaces torch:
    #   pip install --no-deps torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cu128
]

[project.optional-dependencies]
# the three evaluation harnesses: lm-evaluation-harness (text), lmms-eval (images), and what RULER's scripts import
eval = ["accelerate", "lm_eval", "lmms-eval", "tenacity", "nltk", "wonderwords", "scipy", "beautifulsoup4", "html2text",
        "pandas", "pyyaml", "tqdm", "langdetect", "immutabledict"]
# Hopper-class GPUs (compute capability 9.x) with Triton 3.4–3.7: FLA refuses the Triton backward of gated
# chunk kernels (incorrect results, fla-org/flash-linear-attention#640) and uses TileLang instead.
hopper = ["tilelang>=0.1.8"]
# the `mamba3` kernel: FLA's Mamba-3 layer runs on mamba_ssm's kernels, and decodes token by token with a
# CuTe-DSL kernel.  Install mamba_ssm itself with `--no-deps --no-build-isolation` first: resolved normally it
# pins another TileLang and pulls another torch build.
mamba3 = ["nvidia-cutlass-dsl>=4.8", "quack-kernels>=0.6.5"]
# `distill` then also writes its curves as TensorBoard scalars (without it: train_log.jsonl only).
tensorboard = ["tensorboard"]

[project.scripts]
linswap = "linswap.cli:main"

[project.urls]
Homepage = "https://github.com/yuang-chen/LinearSwap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linswap = ["py.typed"]
